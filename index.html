<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0616">
<title>⚡ دوز نئون</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow-x: hidden; overflow-y: auto;
  font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
  background: #0a0616; color: #fff; -webkit-user-select: none; user-select: none; }

#particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

body::before, body::after {
  content: ''; position: fixed; border-radius: 50%;
  filter: blur(80px); opacity: 0.35; z-index: 0; pointer-events: none;
  animation: floatBlob 20s ease-in-out infinite;
}
body::before { width: 400px; height: 400px;
  background: radial-gradient(circle, #ff006e, transparent 70%);
  top: -100px; right: -100px; }
body::after { width: 400px; height: 400px;
  background: radial-gradient(circle, #00f5ff, transparent 70%);
  bottom: -100px; left: -100px; animation-delay: -10s; }
@keyframes floatBlob {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(40px, -30px) scale(1.1); }
  66% { transform: translate(-30px, 40px) scale(0.9); }
}

.wrap {
  position: relative; z-index: 1;
  min-height: 100vh; min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  padding-top: max(16px, env(safe-area-inset-top));
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.game-container {
  background: rgba(20, 15, 40, 0.8);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 28px; padding: 22px 18px;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset,
    0 20px 60px rgba(0,0,0,0.6), 0 0 80px rgba(138, 43, 226, 0.15);
  max-width: 440px; width: 100%;
  border: 1px solid rgba(255,255,255,0.08);
  animation: fadeUp 0.5s ease;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
h1 { font-size: 1.35rem; font-weight: 900;
  background: linear-gradient(90deg, #ff006e, #8338ec, #00f5ff, #ff006e);
  background-size: 300% 100%; -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; animation: slideGradient 4s linear infinite;
  letter-spacing: -0.5px; }
@keyframes slideGradient { to { background-position: -300% 0; } }

.icon-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
  color: inherit; font-size: 1.1rem; width: 40px; height: 40px; border-radius: 12px;
  cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
.icon-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.15); }

.btn { width: 100%; padding: 14px 16px; border: none; border-radius: 14px;
  font-size: 0.95rem; font-weight: 700; cursor: pointer; font-family: inherit;
  margin-bottom: 10px; transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
  -webkit-appearance: none; color: #fff; }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: linear-gradient(135deg, #ff006e, #8338ec); box-shadow: 0 8px 25px rgba(255, 0, 110, 0.35); }
.btn-secondary { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); }
.btn-cyan { background: linear-gradient(135deg, #00f5ff, #0080ff); color: #001a1a; box-shadow: 0 8px 25px rgba(0, 245, 255, 0.3); }
.btn-danger { background: rgba(255, 60, 90, 0.15); color: #ff5c78; border: 1px solid rgba(255, 60, 90, 0.35); }

.input { width: 100%; padding: 16px; border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05);
  color: inherit; font-size: 1.6rem; text-align: center; letter-spacing: 8px;
  font-weight: 800; margin-bottom: 10px; font-family: 'Courier New', monospace;
  -webkit-appearance: none; transition: 0.2s; }
.input::placeholder { font-size: 0.85rem; letter-spacing: normal; font-weight: 400; opacity: 0.5; font-family: inherit; }
.input:focus { outline: none; border-color: #00f5ff; box-shadow: 0 0 20px rgba(0, 245, 255, 0.3); }

.divider { position: relative; margin: 14px 0; opacity: 0.5; font-size: 0.8rem; text-align: center; }
.divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px;
  background: linear-gradient(90deg, transparent, currentColor, transparent); }
.divider::before { right: 0; } .divider::after { left: 0; }

/* ===== کارت اشتراک‌گذاری ===== */
.share-card {
  margin-top: 16px; padding: 16px;
  background: linear-gradient(135deg, rgba(255, 0, 110, 0.08), rgba(131, 56, 236, 0.08));
  border-radius: 18px; border: 1px solid rgba(255, 0, 110, 0.25);
  animation: fadeUp 0.4s ease;
}
.share-title { font-size: 0.85rem; opacity: 0.85; margin-bottom: 10px; text-align: center; }
.code-big {
  font-size: 2.4rem; font-weight: 900; letter-spacing: 6px;
  text-align: center; direction: ltr;
  font-family: 'Courier New', monospace;
  background: linear-gradient(135deg, #ff006e, #ffd200, #00f5ff);
  background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: slideGradient 3s linear infinite;
  margin: 6px 0 12px;
  cursor: pointer; user-select: text;
}
.qr-wrap {
  background: #fff; padding: 10px; border-radius: 14px;
  width: 160px; height: 160px; margin: 0 auto 10px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 30px rgba(0, 245, 255, 0.25);
}
.qr-wrap img { width: 100%; height: 100%; display: block; border-radius: 4px; }

.loader { width: 40px; height: 40px; margin: 0 auto 12px; position: relative; }
.loader::before, .loader::after { content: ''; position: absolute; inset: 0;
  border-radius: 50%; border: 3px solid transparent; }
.loader::before { border-top-color: #00f5ff; border-right-color: #ff006e; animation: spin 1s linear infinite; }
.loader::after { inset: 6px; border-bottom-color: #8338ec; animation: spin 1.5s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }

.hint { font-size: 0.78rem; color: #00f5ff; margin-top: 8px; min-height: 14px; text-align: center; transition: 0.2s; }
.hint.error { color: #ff5c78; }
.hint.success { color: #00ff9d; }
.hint.big { font-size: 0.9rem; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 10px; margin-top: 12px; }

.conn-status { display: flex; align-items: center; gap: 8px; justify-content: center;
  padding: 8px 12px; background: rgba(0,0,0,0.3); border-radius: 10px;
  margin-bottom: 12px; font-size: 0.8rem; font-weight: 600; }
.conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff5c78; animation: blink 1s infinite; }
.conn-dot.connecting { background: #ffd200; }
.conn-dot.connected { background: #00ff9d; animation: none; box-shadow: 0 0 10px #00ff9d; }
@keyframes blink { 50% { opacity: 0.3; } }

.scoreboard { display: flex; gap: 8px; margin-bottom: 12px; }
.score-card { flex: 1; background: rgba(255,255,255,0.05); border-radius: 14px;
  padding: 10px 4px; border: 2px solid transparent; transition: 0.3s; text-align: center; }
.score-card.active { border-color: #00f5ff; background: rgba(0, 245, 255, 0.08);
  box-shadow: 0 0 20px rgba(0, 245, 255, 0.3); }
.score-card .label { font-size: 0.7rem; opacity: 0.75; margin-bottom: 3px; font-weight: 600; }
.score-card .value { font-size: 1.5rem; font-weight: 900; line-height: 1; }
.score-card.x .value { color: #ff006e; text-shadow: 0 0 15px rgba(255,0,110,0.6); }
.score-card.o .value { color: #00f5ff; text-shadow: 0 0 15px rgba(0,245,255,0.6); }
.score-card.draw .value { color: #b0b0b0; }

.timer-wrap { height: 4px; background: rgba(255,255,255,0.08); border-radius: 4px;
  overflow: hidden; margin-bottom: 12px; }
.timer-bar { height: 100%; width: 100%;
  background: linear-gradient(90deg, #00f5ff, #ff006e); border-radius: 4px;
  transition: width 0.1s linear; box-shadow: 0 0 10px currentColor; }
.timer-bar.warning { background: linear-gradient(90deg, #ff006e, #ff5c78); }

.status { font-size: 1rem; font-weight: 700; margin-bottom: 12px; min-height: 24px; text-align: center; }

.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.cell { aspect-ratio: 1; background: rgba(255,255,255,0.04);
  border: 2px solid rgba(255,255,255,0.1); border-radius: 16px;
  font-size: 2.6rem; font-weight: 900; display: flex; align-items: center;
  justify-content: center; cursor: pointer; transition: 0.2s; position: relative;
  overflow: hidden; font-family: 'Courier New', monospace; color: #fff; }
.cell:active:not(.taken) { transform: scale(0.95); border-color: rgba(0, 245, 255, 0.6); }
.cell.taken { cursor: not-allowed; }
.cell.x { color: #ff006e; text-shadow: 0 0 20px #ff006e, 0 0 40px rgba(255,0,110,0.5);
  border-color: rgba(255, 0, 110, 0.3); }
.cell.o { color: #00f5ff; text-shadow: 0 0 20px #00f5ff, 0 0 40px rgba(0,245,255,0.5);
  border-color: rgba(0, 245, 255, 0.3); }
.cell.win { animation: winPulse 0.5s ease 4; border-color: #ffd200;
  box-shadow: 0 0 30px #ffd200, inset 0 0 20px rgba(255, 210, 0, 0.3); }
@keyframes winPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
.cell.pop { animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes popIn { 0% { transform: scale(0) rotate(-45deg); }
  70% { transform: scale(1.15) rotate(5deg); } 100% { transform: scale(1) rotate(0); } }

.actions { display: flex; gap: 8px; }
.actions .btn { margin-bottom: 0; padding: 12px 8px; font-size: 0.85rem; }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: 0.3s; z-index: 100; padding: 20px; }
.overlay.show { opacity: 1; pointer-events: auto; }
.popup { background: linear-gradient(135deg, #1a1030, #2a1548);
  padding: 30px 24px; border-radius: 24px; text-align: center;
  transform: scale(0.85) translateY(20px);
  transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  border: 1px solid rgba(255, 210, 0, 0.3); max-width: 340px; width: 100%;
  box-shadow: 0 0 60px rgba(255, 210, 0, 0.2); }
.overlay.show .popup { transform: scale(1) translateY(0); }
.popup h2 { font-size: 1.7rem; margin-bottom: 8px; font-weight: 900; }
.popup h2.win { background: linear-gradient(90deg, #ffd200, #ff006e);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.popup h2.lose { color: #ff5c78; }
.popup h2.draw { background: linear-gradient(90deg, #b0b0b0, #00f5ff);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.popup p { opacity: 0.85; margin-bottom: 18px; font-size: 0.95rem; }
.popup .big-emoji { font-size: 3.5rem; margin-bottom: 8px; animation: bounce 0.8s infinite; }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

.hidden { display: none !important; }
.center { text-align: center; }
.mb { margin-bottom: 10px; }

.series-badge { display: inline-block; padding: 4px 10px;
  background: linear-gradient(135deg, rgba(255, 210, 0, 0.2), rgba(255, 0, 110, 0.2));
  border: 1px solid rgba(255, 210, 0, 0.4); border-radius: 20px;
  font-size: 0.7rem; font-weight: 700; margin-bottom: 10px; color: #ffd200; }

#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 99; }

@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.shake { animation: shake 0.3s ease; }

@media (max-width: 380px) {
  .game-container { padding: 18px 12px; border-radius: 22px; }
  h1 { font-size: 1.2rem; }
  .cell { font-size: 2.2rem; border-radius: 12px; }
  .code-big { font-size: 2rem; letter-spacing: 4px; }
  .qr-wrap { width: 140px; height: 140px; }
}
</style>
</head>
<body>

<canvas id="particles"></canvas>
<canvas id="confetti"></canvas>

<div class="wrap">
  <div class="game-container">
    <div class="header">
      <h1>⚡ دوز نئون</h1>
      <button class="icon-btn" id="themeToggle" type="button">🎨</button>
    </div>

    <div class="conn-status">
      <span class="conn-dot" id="connDot"></span>
      <span id="connText">آفلاین</span>
    </div>

    <!-- لابی -->
    <div id="lobby">
      <button class="btn btn-primary" id="createRoomBtn" type="button">➕ ساخت اتاق</button>
      <div class="divider"><span>یا</span></div>
      <input type="tel" id="joinCode" class="input" placeholder="کد ۶ رقمی" maxlength="6" inputmode="numeric" autocomplete="off">
      <button class="btn btn-secondary" id="joinRoomBtn" type="button">🚪 ورود به اتاق</button>

      <div id="waiting" class="hidden">
        <div class="share-card">
          <div class="loader"></div>
          <div class="share-title">🔗 دوستت رو دعوت کن:</div>
          <div class="code-big" id="roomCodeDisplay">------</div>
          <div class="qr-wrap"><img id="qrImg" alt="QR Code"></div>
          <p class="hint" style="margin-bottom:10px;">📷 با دوربین گوشی اسکن کن یا کد بالا رو بهش بگو</p>
          <button class="btn btn-cyan" id="shareLinkBtn" type="button">📤 اشتراک‌گذاری لینک</button>
          <button class="btn btn-secondary" id="copyLinkBtn" type="button">📋 کپی لینک</button>
          <button class="btn btn-secondary" id="testLinkBtn" type="button">🔍 تست لینک</button>
          <button class="btn btn-danger" id="cancelWaitBtn" type="button">✖ انصراف</button>
          <p class="hint" id="copyHint"></p>
        </div>
      </div>

      <p class="hint big" id="lobbyHint"></p>
    </div>

    <!-- بازی -->
    <div id="gameArea" class="hidden">
      <div class="center"><span class="series-badge" id="seriesBadge">🎯 اولین دور</span></div>
      <div class="scoreboard">
        <div class="score-card x" id="scoreXCard">
          <div class="label" id="labelX">تو</div>
          <div class="value" id="scoreX">0</div>
        </div>
        <div class="score-card draw">
          <div class="label">مساوی</div>
          <div class="value" id="scoreDraw">0</div>
        </div>
        <div class="score-card o" id="scoreOCard">
          <div class="label" id="labelO">دوستت</div>
          <div class="value" id="scoreO">0</div>
        </div>
      </div>

      <div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>
      <div class="status" id="status">در حال اتصال...</div>
      <div class="board" id="board"></div>

      <div class="actions">
        <button class="btn btn-primary" id="newRoundBtn" type="button">🔄 دور جدید</button>
        <button class="btn btn-danger" id="leaveBtn" type="button">🚪 خروج</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="popup">
    <div class="big-emoji" id="popupEmoji">🎉</div>
    <h2 id="popupTitle">برنده!</h2>
    <p id="popupMessage"></p>
    <button class="btn btn-primary" id="popupBtn" type="button">دور بعدی</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function() {
  'use strict';

  const WINNING_COMBOS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const ROOM_PREFIX = 'doozneon9k7';
  const TURN_TIME = 25;
  const WIN_TARGET = 3;

  // ====== ICE servers با TURN (خیلی مهم!) ======
  const ICE_CONFIG = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:global.stun.twilio.com:3478' },
      // TURN سرور رایگان OpenRelay — برای عبور از NAT سیم‌کارتی
      {
        urls: 'turn:openrelay.metered.ca:80',
        username: 'openrelayproject',
        credential: 'openrelayproject'
      },
      {
        urls: 'turn:openrelay.metered.ca:443',
        username: 'openrelayproject',
        credential: 'openrelayproject'
      },
      {
        urls: 'turn:openrelay.metered.ca:443?transport=tcp',
        username: 'openrelayproject',
        credential: 'openrelayproject'
      }
    ],
    iceCandidatePoolSize: 10
  };

  let peer = null, conn = null;
  let isHost = false, mySymbol = null;
  let currentPlayer = 'X';
  let board = Array(9).fill('');
  let gameActive = false, connected = false;
  let scores = { X: 0, O: 0, draw: 0 };
  let roomCode = null;
  let turnTimer = null, turnTimeLeft = TURN_TIME;
  let retryCount = 0;
  const MAX_RETRIES = 5;
  let joinTimeout = null;

  const $ = id => document.getElementById(id);
  const lobby = $('lobby'), waiting = $('waiting'), gameArea = $('gameArea');
  const statusEl = $('status'), boardEl = $('board');
  const overlay = $('overlay'), popupTitle = $('popupTitle');
  const popupMessage = $('popupMessage'), popupEmoji = $('popupEmoji');
  const copyHint = $('copyHint'), lobbyHint = $('lobbyHint');
  const roomCodeDisplay = $('roomCodeDisplay');
  const connDot = $('connDot'), connText = $('connText');
  const timerBar = $('timerBar'), seriesBadge = $('seriesBadge');

  // ====== صدا ======
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTone(f, d, t) {
    if (!audioCtx) return;
    try {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = t || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.08, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + d);
    } catch(e){}
  }
  const sfx = {
    move: () => playTone(600, 0.08, 'triangle'),
    win: () => { playTone(523,0.15); setTimeout(()=>playTone(659,0.15),100); setTimeout(()=>playTone(784,0.3),200); },
    lose: () => { playTone(400,0.15,'sawtooth'); setTimeout(()=>playTone(300,0.3,'sawtooth'),150); },
    draw: () => { playTone(400,0.2); setTimeout(()=>playTone(400,0.2),250); },
    connect: () => { playTone(880,0.1); setTimeout(()=>playTone(1200,0.15),100); },
    click: () => playTone(500, 0.04, 'square')
  };
  function vibrate(p) { if (navigator.vibrate) try { navigator.vibrate(p); } catch(e){} }

  // ====== ذرات ======
  (function initParticles() {
    const c = $('particles'), ctx = c.getContext('2d');
    let ps = [];
    function resize() { c.width = innerWidth; c.height = innerHeight; }
    resize(); addEventListener('resize', resize);
    for (let i = 0; i < 35; i++) ps.push({
      x: Math.random()*c.width, y: Math.random()*c.height,
      r: Math.random()*1.8+0.5, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3,
      color: Math.random()>0.5?'255,0,110':'0,245,255', a: Math.random()*0.5+0.2
    });
    (function loop() {
      ctx.clearRect(0,0,c.width,c.height);
      ps.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x<0||p.x>c.width) p.vx *= -1;
        if (p.y<0||p.y>c.height) p.vy *= -1;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle = 'rgba('+p.color+','+p.a+')'; ctx.fill();
      });
      requestAnimationFrame(loop);
    })();
  })();

  // ====== کانفتی ======
  function launchConfetti() {
    const c = $('confetti'), ctx = c.getContext('2d');
    c.width = innerWidth; c.height = innerHeight;
    const colors = ['#ff006e','#00f5ff','#8338ec','#ffd200','#00ff9d'];
    const pieces = [];
    for (let i = 0; i < 100; i++) pieces.push({
      x: Math.random()*c.width, y: -20 - Math.random()*c.height*0.5,
      vx: (Math.random()-0.5)*4, vy: Math.random()*3+2,
      size: Math.random()*6+4, color: colors[(Math.random()*colors.length)|0],
      rot: Math.random()*Math.PI*2, vrot: (Math.random()-0.5)*0.2
    });
    let f = 0;
    (function draw() {
      ctx.clearRect(0,0,c.width,c.height);
      pieces.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.rot += p.vrot; p.vy += 0.1;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
        ctx.restore();
      });
      f++;
      if (f < 180) requestAnimationFrame(draw);
      else ctx.clearRect(0,0,c.width,c.height);
    })();
  }

  // ====== ابزار ======
  function genCode() { return Math.floor(100000 + Math.random()*900000).toString(); }
  function showHint(el, msg, cls) { el.textContent = msg || ''; el.className = 'hint' + (cls ? ' '+cls : '') + (el.id === 'lobbyHint' ? ' big' : ''); }
  function setConnStatus(state, text) { connDot.className = 'conn-dot ' + (state||''); connText.textContent = text; }
  function updateSeriesBadge() {
    const w = Math.max(scores.X, scores.O);
    if (w === 0) seriesBadge.textContent = '🎯 اولین دور';
    else if (w >= WIN_TARGET-1) seriesBadge.textContent = '🔥 نقطه سرنوشت! ('+w+'/'+WIN_TARGET+')';
    else seriesBadge.textContent = '🎯 بهترین از '+(WIN_TARGET*2-1)+' — '+w+'/'+WIN_TARGET;
  }

  // ====== لینک دعوت ======
  function getInviteLink() {
    // ساخت لینک تمیز حتی اگه pathname با / تموم نشه
    let base = location.origin + location.pathname;
    base = base.replace(/[?#].*$/, ''); // حذف هر query یا hash قبلی
    return base + '?r=' + roomCode;
  }

  // ====== ساخت اتاق (Host) ======
  function createRoom() {
    initAudio(); sfx.click();
    if (peer) try { peer.destroy(); } catch(e){}
    peer = null;

    roomCode = genCode();
    isHost = true;
    mySymbol = 'X';
    retryCount = 0;

    showHint(lobbyHint, '⏳ در حال ساخت اتاق...', '');
    setConnStatus('connecting', 'اتصال به سرور...');

    try {
      peer = new Peer(ROOM_PREFIX + roomCode, { debug: 1, config: ICE_CONFIG });
    } catch(e) {
      showHint(lobbyHint, '❌ خطا: ' + e.message, 'error');
      resetToLobby(); return;
    }

    const timeout = setTimeout(() => {
      if (!peer || !peer.open) {
        showHint(lobbyHint, '❌ سرور پاسخ نداد. اینترنت/VPN رو چک کن و دوباره بزن.', 'error');
        setConnStatus('', 'خطا');
        destroyPeer(); resetToLobby();
      }
    }, 20000);

    peer.on('open', () => {
      clearTimeout(timeout);
      showHint(lobbyHint, '');
      setConnStatus('connecting', 'منتظر دوستت...');

      // اول URL رو آپدیت کن
      try { window.history.replaceState(null, '', '?r=' + roomCode); } catch(e){}

      // بعد نمایش‌ها
      roomCodeDisplay.textContent = roomCode;
      const link = getInviteLink();
      console.log('Invite link:', link);

      // QR code از طریق API عمومی
      const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&data=' + encodeURIComponent(link);
      $('qrImg').src = qrUrl;

      $('createRoomBtn').disabled = true;
      $('joinRoomBtn').disabled = true;
      $('joinCode').disabled = true;
      waiting.classList.remove('hidden');
    });

    peer.on('connection', (c) => {
      if (conn && conn.open) { c.close(); return; }
      conn = c;
      setupConnection();
    });

    peer.on('error', (err) => {
      clearTimeout(timeout);
      console.error('Peer error:', err);
      let msg = 'خطای اتصال';
      if (err.type === 'unavailable-id') msg = 'این کد گرفته شده، دوباره بزن';
      else if (err.type === 'network') msg = 'اینترنت قطع است';
      else if (err.type === 'server-error') msg = 'سرور شلوغه، کمی بعد';
      else if (err.type === 'browser-incompatible') msg = 'مرورگر پشتیبانی نمی‌کنه';
      showHint(lobbyHint, '❌ ' + msg, 'error');
      setConnStatus('', 'خطا');
      destroyPeer(); resetToLobby();
    });
  }

  // ====== ورود به اتاق (Guest) ======
  function joinRoom(code, isRetry) {
    initAudio();
    if (!isRetry) sfx.click();

    code = String(code||'').replace(/\D/g, '');
    if (code.length !== 6) {
      showHint(lobbyHint, '❌ کد باید ۶ رقم باشه', 'error');
      return;
    }

    if (!isRetry) {
      if (peer) try { peer.destroy(); } catch(e){}
      peer = null;
      isHost = false;
      mySymbol = 'O';
      roomCode = code;
      retryCount = 0;
      showHint(lobbyHint, '🔎 در حال پیدا کردن اتاق ' + code + '...', '');
      setConnStatus('connecting', 'اتصال...');
      lobby.classList.add('hidden');
      waiting.classList.remove('hidden');
      roomCodeDisplay.textContent = code;
      $('qrImg').src = '';
      $('waiting').querySelector('.share-card').innerHTML =
        '<div class="loader"></div>' +
        '<div class="share-title">⏳ در حال اتصال به اتاق...</div>' +
        '<div class="code-big">' + code + '</div>' +
        '<p class="hint" id="guestHint">اگه تا ۲۰ ثانیه وصل نشد، پیام خطا نمایش داده می‌شه</p>' +
        '<button class="btn btn-danger" id="cancelWaitBtn2" type="button">✖ انصراف</button>';
      $('cancelWaitBtn2').addEventListener('click', () => { if (confirm('لغو کنم؟')) resetToLobby(); });
    }

    try {
      peer = new Peer({ debug: 1, config: ICE_CONFIG });
    } catch(e) {
      showHint(lobbyHint, '❌ ' + e.message, 'error');
      resetToLobby(); return;
    }

    peer.on('open', () => {
      showHint(lobbyHint, '🔎 در حال پیدا کردن میزبان...', '');
      tryConnect();
    });

    peer.on('error', (err) => {
      console.error('Peer error:', err);
      if (err.type === 'peer-unavailable') {
        handleRetry();
      } else if (err.type === 'network') {
        showHint(lobbyHint, '❌ اینترنت قطع است', 'error');
        setConnStatus('', 'آفلاین');
        destroyPeer(); resetToLobby();
      } else if (!isRetry) {
        showHint(lobbyHint, '❌ ' + (err.type||'خطا'), 'error');
        setConnStatus('', 'خطا');
        destroyPeer(); resetToLobby();
      }
    });

    // timeout کلی
    if (joinTimeout) clearTimeout(joinTimeout);
    joinTimeout = setTimeout(() => {
      if (!connected) {
        handleRetry();
      }
    }, 8000);
  }

  function tryConnect() {
    if (!peer || !peer.open) return;
    try { if (conn) conn.close(); } catch(e){}
    conn = peer.connect(ROOM_PREFIX + roomCode, { reliable: true });
    setupConnection();

    // timeout جداگانه برای این تلاش
    setTimeout(() => {
      if (!connected && retryCount < MAX_RETRIES) handleRetry();
    }, 5000);
  }

  function handleRetry() {
    if (connected) return;
    if (retryCount >= MAX_RETRIES) {
      const gh = $('guestHint');
      if (gh) gh.textContent = '❌ اتاق پیدا نشد. میزبان باید صفحه رو باز نگه داره.';
      showHint(lobbyHint, '❌ اتاقی با این کد پیدا نشد. مطمئن شو دوستت صفحه رو بسته نکرده.', 'error');
      setConnStatus('', 'ناموفق');
      setTimeout(() => {
        if (confirm('اتصال ناموفق بود. برگردیم لابی و دوباره امتحان کنیم؟')) resetToLobby();
      }, 500);
      return;
    }
    retryCount++;
    const gh = $('guestHint');
    if (gh) gh.textContent = '🔄 تلاش ' + retryCount + ' از ' + MAX_RETRIES + '...';
    showHint(lobbyHint, '🔄 تلاش ' + retryCount + ' از ' + MAX_RETRIES + '...', '');
    setTimeout(() => {
      if (peer && peer.open && !connected) tryConnect();
    }, 1500);
  }

  // ====== اتصال ======
  function setupConnection() {
    if (!conn) return;

    conn.on('open', () => {
      connected = true;
      retryCount = 0;
      if (joinTimeout) clearTimeout(joinTimeout);
      waiting.classList.add('hidden');
      lobby.classList.add('hidden');
      gameArea.classList.remove('hidden');
      showHint(lobbyHint, '');
      setConnStatus('connected', '✅ متصل');
      sfx.connect(); vibrate([30, 50, 30]);
      scores = { X: 0, O: 0, draw: 0 };
      updateScores();
      startNewRound();
    });

    conn.on('data', (d) => { try { handleMessage(d); } catch(e){ console.error(e); } });

    conn.on('close', () => {
      connected = false; gameActive = false; stopTimer();
      setConnStatus('', 'قطع شد');
      statusEl.textContent = '❌ دوستت خارج شد';
      setTimeout(() => {
        if (confirm('دوستت خارج شد. برگردیم لابی؟')) resetToLobby();
      }, 300);
    });

    conn.on('error', (err) => console.error('Conn error:', err));
  }

  function handleMessage(d) {
    if (!d || !d.type) return;
    switch (d.type) {
      case 'move': applyMove(d.index, d.player); break;
      case 'new-round': startNewRound(); break;
      case 'timeout': handleOpponentTimeout(); break;
    }
  }

  // ====== تایمر ======
  function startTimer() {
    stopTimer();
    turnTimeLeft = TURN_TIME;
    timerBar.style.width = '100%';
    timerBar.classList.remove('warning');
    turnTimer = setInterval(() => {
      turnTimeLeft -= 0.1;
      const pct = Math.max(0, (turnTimeLeft/TURN_TIME)*100);
      timerBar.style.width = pct + '%';
      if (pct < 30) timerBar.classList.add('warning');
      if (turnTimeLeft <= 0) { stopTimer(); handleTimeout(); }
    }, 100);
  }
  function stopTimer() { if (turnTimer) clearInterval(turnTimer); turnTimer = null; }

  function handleTimeout() {
    if (!gameActive) return;
    if (currentPlayer === mySymbol) {
      if (conn && conn.open) conn.send({ type: 'timeout', loser: mySymbol });
      handleOpponentTimeout();
    }
  }

  function handleOpponentTimeout() {
    if (!gameActive) return;
    gameActive = false; stopTimer();
    const winner = currentPlayer === 'X' ? 'O' : 'X';
    scores[winner]++; updateScores(); updateSeriesBadge();
    if (winner === mySymbol) {
      sfx.win(); vibrate([50,100,50,100,50]); launchConfetti();
      showPopup('⏰ حریف تایم‌اوت شد!', 'خودکار بردی! 😎', 'win');
    } else {
      sfx.lose();
      showPopup('⏰ تایم‌اوت شدی!', 'حریف خودکار برد. سریع‌تر بازی کن!', 'lose');
    }
  }

  // ====== دور جدید ======
  function startNewRound() {
    board = Array(9).fill('');
    currentPlayer = 'X';
    gameActive = true;
    renderBoard(); updateStatus(); updateSeriesBadge(); hidePopup();
    if (connected) startTimer();
  }

  function renderBoard() {
    boardEl.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell' + (board[i] ? ' taken ' + board[i].toLowerCase() : '');
      cell.textContent = board[i] || '';
      cell.dataset.index = i;
      cell.addEventListener('click', () => handleCellClick(i));
      boardEl.appendChild(cell);
    }
    updateActiveScoreCard();
  }

  function handleCellClick(i) {
    if (!gameActive || !connected) return;
    if (board[i] !== '') return;
    if (currentPlayer !== mySymbol) {
      statusEl.textContent = '⏳ صبر کن، نوبت دوستته';
      boardEl.classList.add('shake');
      setTimeout(() => boardEl.classList.remove('shake'), 300);
      vibrate(30); return;
    }
    sfx.move(); vibrate(15);
    if (conn && conn.open) conn.send({ type: 'move', index: i, player: mySymbol });
    applyMove(i, mySymbol);
  }

  function applyMove(i, player) {
    if (board[i] !== '' || !gameActive) return;
    board[i] = player;
    const cell = boardEl.children[i];
    if (cell) {
      cell.textContent = player;
      cell.classList.add('taken', 'pop', player.toLowerCase());
      setTimeout(() => cell.classList.remove('pop'), 350);
    }

    const wc = checkWinner();
    if (wc) {
      gameActive = false; stopTimer();
      wc.forEach(x => boardEl.children[x] && boardEl.children[x].classList.add('win'));
      scores[player]++; updateScores(); updateSeriesBadge();
      const iWon = player === mySymbol;
      const seriesOver = scores[player] >= WIN_TARGET;
      if (iWon) { sfx.win(); vibrate([50,100,50,100,50]); launchConfetti(); }
      else { sfx.lose(); vibrate([100,50,100]); }
      setTimeout(() => {
        if (seriesOver) {
          showPopup(iWon ? '🏆 قهرمان شدی!' : '😔 حریف قهرمان شد',
                    iWon ? 'سری رو بردی! '+scores.X+'-'+scores.O : 'دفعه بعد جبران کن!',
                    iWon ? 'win' : 'lose');
        } else {
          showPopup(iWon ? '🎉 بردی!' : '😢 باختی!',
                    iWon ? 'یک قدم نزدیک‌تر به قهرمانی!' : 'دفعه بعد جبران کن!',
                    iWon ? 'win' : 'lose');
        }
      }, 500);
      return;
    }

    if (board.every(c => c !== '')) {
      gameActive = false; stopTimer();
      scores.draw++; updateScores(); updateSeriesBadge();
      sfx.draw();
      setTimeout(() => showPopup('🤝 مساوی!', 'هیچ‌کدام نبردند!', 'draw'), 400);
      return;
    }

    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    updateStatus(); updateActiveScoreCard();
    if (connected) startTimer();
  }

  function checkWinner() {
    for (const [a,b,c] of WINNING_COMBOS)
      if (board[a] && board[a]===board[b] && board[a]===board[c]) return [a,b,c];
    return null;
  }

  function updateStatus() {
    if (!connected) { statusEl.textContent = 'در حال اتصال...'; statusEl.style.color = '#b0b0b0'; return; }
    if (!gameActive) return;
    if (currentPlayer === mySymbol) { statusEl.textContent = '🟢 نوبت خودته'; statusEl.style.color = '#00ff9d'; }
    else { statusEl.textContent = '⏳ نوبت دوستته'; statusEl.style.color = '#ffd200'; }
  }
  function updateScores() {
    $('scoreX').textContent = scores.X;
    $('scoreO').textContent = scores.O;
    $('scoreDraw').textContent = scores.draw;
  }
  function updateActiveScoreCard() {
    const xIsMe = mySymbol === 'X';
    $('labelX').textContent = xIsMe ? 'تو' : 'دوستت';
    $('labelO').textContent = xIsMe ? 'دوستت' : 'تو';
    $('scoreXCard').classList.toggle('active', currentPlayer === 'X');
    $('scoreOCard').classList.toggle('active', currentPlayer === 'O');
  }
  function showPopup(t, m, type) {
    popupTitle.textContent = t;
    popupTitle.className = type || '';
    popupMessage.textContent = m;
    popupEmoji.textContent = type === 'win' ? '🏆' : type === 'lose' ? '😢' : '🤝';
    overlay.classList.add('show');
  }
  function hidePopup() { overlay.classList.remove('show'); }

  function destroyPeer() {
    if (peer) try { peer.destroy(); } catch(e){}
    peer = null; conn = null; connected = false;
    stopTimer();
    if (joinTimeout) clearTimeout(joinTimeout);
  }

  function resetToLobby() {
    destroyPeer();
    roomCode = null; isHost = false; mySymbol = null; retryCount = 0;
    try { window.history.replaceState(null, '', location.pathname); } catch(e){}
    // ریست کارت waiting به حالت اولیه
    $('waiting').innerHTML = `
      <div class="share-card">
        <div class="loader"></div>
        <div class="share-title">🔗 دوستت رو دعوت کن:</div>
        <div class="code-big" id="roomCodeDisplay">------</div>
        <div class="qr-wrap"><img id="qrImg" alt="QR"></div>
        <p class="hint" style="margin-bottom:10px;">📷 با دوربین گوشی اسکن کن یا کد بالا رو بهش بگو</p>
        <button class="btn btn-cyan" id="shareLinkBtn" type="button">📤 اشتراک‌گذاری لینک</button>
        <button class="btn btn-secondary" id="copyLinkBtn" type="button">📋 کپی لینک</button>
        <button class="btn btn-secondary" id="testLinkBtn" type="button">🔍 تست لینک</button>
        <button class="btn btn-danger" id="cancelWaitBtn" type="button">✖ انصراف</button>
        <p class="hint" id="copyHint"></p>
      </div>`;
    bindWaitingButtons();
    waiting.classList.add('hidden');
    lobby.classList.remove('hidden');
    gameArea.classList.add('hidden');
    $('createRoomBtn').disabled = false;
    $('joinRoomBtn').disabled = false;
    $('joinCode').disabled = false;
    $('joinCode').value = '';
    setConnStatus('', 'آفلاین');
    showHint(lobbyHint, '');
  }

  // ====== اشتراک / کپی ======
  function bindWaitingButtons() {
    const s = $('shareLinkBtn'), c = $('copyLinkBtn'), t = $('testLinkBtn'), x = $('cancelWaitBtn');
    if (s) s.addEventListener('click', shareLink);
    if (c) c.addEventListener('click', copyLink);
    if (t) t.addEventListener('click', testLink);
    if (x) x.addEventListener('click', () => { if (confirm('لغو کنم؟')) resetToLobby(); });
  }

  async function shareLink() {
    sfx.click();
    if (!roomCode) return;
    const url = getInviteLink();
    const text = '⚡ بیا دوز نئون بازی کنیم!\nکد اتاق: ' + roomCode + '\nیا این لینک رو باز کن:';
    if (navigator.share) {
      try {
        await navigator.share({ title: 'دوز نئون', text: text, url: url });
        showHint(copyHint, '✅ ارسال شد', 'success'); return;
      } catch(e) { if (e && e.name === 'AbortError') return; }
    }
    copyLink();
  }

  function copyLink() {
    sfx.click();
    if (!roomCode) return;
    const url = getInviteLink();
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url).then(() => {
        showHint(copyHint, '✅ کپی شد!', 'success');
        setTimeout(() => showHint(copyHint, ''), 3000);
      }).catch(() => fallbackCopy(url));
    } else fallbackCopy(url);
  }

  function fallbackCopy(url) {
    const ta = document.createElement('textarea');
    ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    showHint(copyHint, ok ? '✅ کپی شد!' : '⚠️ دستی کپی کن: ' + url, ok ? 'success' : 'error');
    if (ok) setTimeout(() => showHint(copyHint, ''), 3000);
  }

  function testLink() {
    sfx.click();
    if (!roomCode) return;
    const url = getInviteLink();
    window.open(url, '_blank');
    showHint(copyHint, '🔍 لینک در تب جدید باز شد — اگه باز شد، درسته ✅', 'success');
  }

  // ====== رویدادها ======
  $('createRoomBtn').addEventListener('click', createRoom);
  $('joinRoomBtn').addEventListener('click', () => joinRoom($('joinCode').value));
  $('joinCode').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
  });
  $('joinCode').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') joinRoom($('joinCode').value);
  });

  bindWaitingButtons();

  $('newRoundBtn').addEventListener('click', () => {
    if (!connected) return;
    sfx.click();
    if (conn && conn.open) conn.send({ type: 'new-round' });
    startNewRound();
  });
  $('popupBtn').addEventListener('click', () => {
    sfx.click();
    if (!connected) { resetToLobby(); return; }
    if (conn && conn.open) conn.send({ type: 'new-round' });
    startNewRound();
  });
  $('leaveBtn').addEventListener('click', () => { if (confirm('مطمئنی خارج شی؟')) resetToLobby(); });

  $('themeToggle').addEventListener('click', () => {
    playTone(700, 0.1, 'triangle');
    document.body.classList.toggle('dark-mode');
  });

  // ====== راه‌اندازی ======
  const params = new URLSearchParams(location.search);
  const r = (params.get('r') || params.get('room') || '').replace(/\D/g, '').slice(0, 6);
  if (r.length === 6) {
    $('joinCode').value = r;
    showHint(lobbyHint, '🔗 لینک دعوت شناسایی شد! در حال اتصال به اتاق ' + r + '...', '');
    setTimeout(() => {
      if (typeof Peer === 'undefined') {
        showHint(lobbyHint, '❌ کتابخانه لود نشد. اینترنت رو چک کن و صفحه رو رفرش کن.', 'error');
        return;
      }
      joinRoom(r);
    }, 500);
  }

  window.addEventListener('beforeunload', destroyPeer);
})();
</script>
</body>
</html>
